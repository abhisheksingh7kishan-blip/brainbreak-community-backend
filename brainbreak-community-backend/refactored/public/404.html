<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Not found</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; font-family: -apple-system, system-ui, sans-serif; background:#0b0d18; color:#eaf0ff;
    display:flex; align-items:center; justify-content:center; min-height:100vh; }
  .wrap { max-width: 420px; padding: 24px; text-align: center; }
  h1 { font-size: 48px; margin: 0 0 8px; color: #7dd3fc; }
  p { color: #8892b0; font-size: 14px; margin: 0 0 20px; }
  a { color: #7dd3fc; text-decoration: none; font-size: 14px; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>404</h1>
    <p>There's nothing at this address. This is a backend API service, not a browsable site.</p>
    <a href="/">Back to the status page</a>
  </div>
</body>
</html>
